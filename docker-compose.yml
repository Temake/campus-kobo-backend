services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuskobo-api
    env_file:
        - ./.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      EMAIL_VERIFICATION_CODE_EXPIRE_MINUTES: "15"
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: "60"
      EMAIL_VERIFICATION_MAX_ATTEMPTS: "5"
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST}
      BREVO_SMTP_PORT: "587"
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}
      MAIL_FROM_NAME: CampusKobo
    ports:
      - "8000:8000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: campuskobo-db
    env_file:
        - ./.env
    environment:
      POSTGRES_DB: campuskobo
      POSTGRES_USER: campuskobo
      POSTGRES_PASSWORD: campuskobo
    ports:
      - "54329:5432"
    volumes:
      - campuskobo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuskobo -d campuskobo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  campuskobo_postgres_data:
